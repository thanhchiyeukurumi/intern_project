paths:
  /posts:
    get:
      tags:
        - Posts
      summary: Lấy danh sách bài viết
      description: Lấy danh sách tất cả bài viết
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng bài viết trên mỗi trang
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, popular]
            default: newest
          description: Sắp xếp bài viết
      responses:
        '200':
          description: Danh sách bài viết
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      posts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            title:
                              type: string
                            slug:
                              type: string
                            content:
                              type: string
                            thumbnail:
                              type: string
                            status:
                              type: string
                            userId:
                              type: integer
                            categoryId:
                              type: integer
                            viewCount:
                              type: integer
                            commentCount:
                              type: integer
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                            user:
                              type: object
                            category:
                              type: object
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          totalItems:
                            type: integer
                          totalPages:
                            type: integer
                  status:
                    type: integer
                  message:
                    type: string
    post:
      tags:
        - Posts
      summary: Tạo bài viết mới
      description: Tạo bài viết mới (yêu cầu quyền blogger hoặc admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - categoryId
              properties:
                title:
                  type: string
                  description: Tiêu đề bài viết
                content:
                  type: string
                  description: Nội dung bài viết
                thumbnail:
                  type: string
                  description: URL ảnh thumbnail
                status:
                  type: string
                  enum: [draft, published, archived]
                  default: published
                  description: Trạng thái bài viết
                categoryId:
                  type: integer
                  description: ID danh mục
                languageId:
                  type: integer
                  description: ID ngôn ngữ
                originalPostId:
                  type: integer
                  description: ID bài viết gốc (cho bài dịch)
      responses:
        '201':
          description: Tạo bài viết thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Không có quyền truy cập

  /posts/search:
    get:
      tags:
        - Posts
      summary: Tìm kiếm bài viết
      description: Tìm kiếm bài viết theo từ khóa
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Từ khóa tìm kiếm
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng bài viết trên mỗi trang
      responses:
        '200':
          description: Kết quả tìm kiếm

  /posts/category/{categoryId}:
    get:
      tags:
        - Posts
        - Categories
      summary: Lấy bài viết theo danh mục
      description: Lấy danh sách bài viết theo danh mục
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
          description: ID của danh mục
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng bài viết trên mỗi trang
      responses:
        '200':
          description: Danh sách bài viết theo danh mục
        '404':
          description: Không tìm thấy danh mục

  /posts/user/{userId}:
    get:
      tags:
        - Posts
        - Users
      summary: Lấy bài viết theo người dùng
      description: Lấy danh sách bài viết của người dùng
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: ID của người dùng
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng bài viết trên mỗi trang
      responses:
        '200':
          description: Danh sách bài viết của người dùng
        '404':
          description: Không tìm thấy người dùng

  /posts/original/{originalPostId}:
    get:
      tags:
        - Posts
      summary: Lấy các bài viết dịch
      description: Lấy danh sách các bài viết dịch từ bài viết gốc
      parameters:
        - name: originalPostId
          in: path
          required: true
          schema:
            type: integer
          description: ID của bài viết gốc
      responses:
        '200':
          description: Danh sách bài viết dịch
        '404':
          description: Không tìm thấy bài viết gốc

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Lấy chi tiết bài viết
      description: Lấy thông tin chi tiết của bài viết theo ID hoặc slug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID hoặc slug của bài viết
      responses:
        '200':
          description: Chi tiết bài viết
        '404':
          description: Không tìm thấy bài viết
    put:
      tags:
        - Posts
      summary: Cập nhật bài viết
      description: Cập nhật thông tin bài viết (yêu cầu quyền admin hoặc tác giả)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID của bài viết
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Tiêu đề bài viết
                content:
                  type: string
                  description: Nội dung bài viết
                thumbnail:
                  type: string
                  description: URL ảnh thumbnail
                status:
                  type: string
                  enum: [draft, published, archived]
                  description: Trạng thái bài viết
                categoryId:
                  type: integer
                  description: ID danh mục
                languageId:
                  type: integer
                  description: ID ngôn ngữ
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy bài viết
    delete:
      tags:
        - Posts
      summary: Xóa bài viết
      description: Xóa bài viết (yêu cầu quyền admin hoặc tác giả)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID của bài viết
      responses:
        '200':
          description: Xóa thành công
        '401':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy bài viết

  /posts/{postId}/comments:
    get:
      tags:
        - Posts
        - Comments
      summary: Lấy bình luận của bài viết
      description: Lấy danh sách bình luận của bài viết
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          description: ID của bài viết
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng bình luận trên mỗi trang
      responses:
        '200':
          description: Danh sách bình luận
        '404':
          description: Không tìm thấy bài viết
    post:
      tags:
        - Posts
        - Comments
      summary: Thêm bình luận
      description: Thêm bình luận vào bài viết
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          description: ID của bài viết
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: Nội dung bình luận
                parentId:
                  type: integer
                  description: ID bình luận cha (nếu trả lời bình luận khác)
      responses:
        '201':
          description: Thêm bình luận thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy bài viết

  /posts/stats/date-range:
    get:
      tags:
        - Posts
        - Statistics
      summary: Thống kê bài viết theo khoảng thời gian
      description: Lấy thống kê bài viết trong khoảng thời gian
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Ngày bắt đầu (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Ngày kết thúc (YYYY-MM-DD)
      responses:
        '200':
          description: Dữ liệu thống kê

  /posts/stats/dashboard:
    get:
      tags:
        - Posts
        - Statistics
      summary: Thống kê tổng quan bài viết
      description: Lấy thống kê tổng quan về bài viết (yêu cầu quyền admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dữ liệu thống kê
        '401':
          description: Không có quyền truy cập 