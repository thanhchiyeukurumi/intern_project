paths:
  /comments/me:
    get:
      tags:
        - Comments
      summary: Lấy bình luận của người dùng hiện tại
      description: Lấy danh sách bình luận của người dùng đang đăng nhập
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Số trang
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng bình luận trên mỗi trang
      responses:
        '200':
          description: Danh sách bình luận của người dùng
        '401':
          description: Không có quyền truy cập

  /comments/{id}:
    get:
      tags:
        - Comments
      summary: Lấy chi tiết bình luận
      description: Lấy thông tin chi tiết của bình luận theo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID của bình luận
      responses:
        '200':
          description: Chi tiết bình luận
        '404':
          description: Không tìm thấy bình luận
    put:
      tags:
        - Comments
      summary: Cập nhật bình luận
      description: Cập nhật nội dung bình luận (yêu cầu là chủ sở hữu bình luận)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID của bình luận
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: Nội dung bình luận
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy bình luận
    delete:
      tags:
        - Comments
      summary: Xóa bình luận
      description: Xóa bình luận (yêu cầu quyền admin hoặc chủ sở hữu bình luận)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID của bình luận
      responses:
        '200':
          description: Xóa thành công
        '401':
          description: Không có quyền truy cập
        '404':
          description: Không tìm thấy bình luận

  /comments/stats/date-range:
    get:
      tags:
        - Comments
        - Statistics
      summary: Thống kê bình luận theo khoảng thời gian
      description: Lấy thống kê bình luận trong khoảng thời gian (yêu cầu quyền admin)
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Ngày bắt đầu (YYYY-MM-DD)
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Ngày kết thúc (YYYY-MM-DD)
      responses:
        '200':
          description: Dữ liệu thống kê
        '401':
          description: Không có quyền truy cập

  /comments/stats/dashboard:
    get:
      tags:
        - Comments
        - Statistics
      summary: Thống kê tổng quan bình luận
      description: Lấy thống kê tổng quan về bình luận (yêu cầu quyền admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dữ liệu thống kê
        '401':
          description: Không có quyền truy cập 